name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare isolated native-client dependencies
        if: runner.os != 'Windows'
        run: |
          python -m venv "${RUNNER_TEMP}/emudhraslop-python"
          "${RUNNER_TEMP}/emudhraslop-python/bin/python" -m pip install -r tests/python-requirements.txt
          echo "EMUDHRASLOP_TEST_PYTHON=${RUNNER_TEMP}/emudhraslop-python/bin/python" >> "$GITHUB_ENV"
      - name: Native tests and static checks
        if: runner.os != 'Windows'
        run: make test vet
      - name: Prepare Windows native-client dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r tests/python-requirements.txt
      - name: Native Windows tests under a non-elevated identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-ci.ps1
      - name: Native Apple fixture evaluation
        if: runner.os == 'macOS'
        env:
          EMUDHRASLOP_NATIVE_APPLE_TEST: '1'
        run: go test ./internal/probe -run '^TestAppleNativeFixtures$' -count=1 -timeout=2m
      - name: Release packaging boundary tests
        run: |
          python scripts/test-package-release.py
          python scripts/test-prepare-release.py
      - name: Container and privilege-boundary checks
        if: matrix.os == 'ubuntu-24.04'
        run: make test-containers test-root-containers
      - name: Script syntax and plist checks
        if: runner.os != 'Windows'
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
          if [ "$(uname -s)" = Darwin ]; then
            plutil -lint examples/jamf/io.emudhraslop.scan.plist
          fi
